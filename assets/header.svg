<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ziad Hosny - Full-Stack Software Engineer">
  <title>Ziad Hosny - Full-Stack Software Engineer</title>
  <style>
    .s1 { animation: s1 10s ease-in-out infinite; }
    .s2 { animation: s2 10s ease-in-out infinite; }
    @keyframes s1 { 50% { stop-color: #10121b; } }
    @keyframes s2 { 50% { stop-color: #181430; } }
    .grid { animation: grid 8s linear infinite; }
    @keyframes grid { to { transform: translate(40px, 40px); } }
    .b1 { animation: b1 16s ease-in-out infinite; }
    .b2 { animation: b2 18s ease-in-out infinite; }
    .b3 { animation: b3 20s ease-in-out infinite; }
    @keyframes b1 { 50% { transform: translate(120px, 40px); } }
    @keyframes b2 { 50% { transform: translate(-120px, -30px); } }
    @keyframes b3 { 50% { transform: translate(0, 60px); } }
    .tw { animation: tw 4s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
    .fl { animation: fl 6s ease-in-out infinite; transform-box: fill-box; }
    @keyframes fl { 50% { transform: translateY(-10px); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop class="s1" offset="0" stop-color="#0b0d13"/>
      <stop class="s2" offset="1" stop-color="#141626"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bd93f9"/><stop offset="0.5" stop-color="#8be9fd"/><stop offset="1" stop-color="#bd93f9"/>
    </linearGradient>
    <pattern id="gridp" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f8f8f2" stroke-opacity="0.045"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity="0.3">
      <circle class="b1" cx="180" cy="96" r="144" fill="#bd93f9"/>
      <circle class="b2" cx="1020" cy="224" r="144" fill="#6272a4"/>
      <circle class="b3" cx="600" cy="32" r="101" fill="#8be9fd" opacity="0.5"/>
    </g>
    <rect class="grid" x="-40" y="-40" width="1280" height="400" fill="url(#gridp)"/>
    <g fill="#f8f8f2"><circle class="tw" cx="60" cy="64" r="1.6" style="animation-delay:-0s"/><circle class="tw" cx="1140" cy="96" r="1.6" style="animation-delay:-1.2s"/><circle class="tw" cx="1080" cy="272" r="1.6" style="animation-delay:-2.1s"/><circle class="tw" cx="96" cy="256" r="1.6" style="animation-delay:-0.6s"/><circle class="tw" cx="420" cy="288" r="1.6" style="animation-delay:-1.7s"/><circle class="tw" cx="840" cy="38" r="1.6" style="animation-delay:-2.6s"/></g>
    <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#bd93f9" stroke-opacity="0.18"/>

    <g font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-weight="700" fill="#f8f8f2" opacity="0.08"><text class="fl" x="150" y="80" font-size="28" style="animation-delay:-0s">( )</text><text class="fl" x="1040" y="90" font-size="40" style="animation-delay:-2s">{ }</text><text class="fl" x="90" y="250" font-size="44" style="animation-delay:-1s">&lt;/&gt;</text><text class="fl" x="980" y="285" font-size="28" style="animation-delay:-3s">=&gt;</text></g>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">
      <text x="600.0" y="160" font-size="76" font-weight="800" fill="url(#shine)">Ziad Hosny</text>
      <text x="600.0" y="212" font-size="26" font-weight="500" fill="#f8f8f2" fill-opacity="0.9" letter-spacing="2">Full-Stack Software Engineer</text>
    </g>
    <rect x="520.0" y="234" width="160" height="4" rx="2" fill="url(#shine)"/>
  </g>
</svg>
